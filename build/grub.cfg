# GRUB menu for the projekt-lods installer ISO (see build-installer-iso.sh).
# GRUB's own boot menu always shows "press 'e' to edit the selected entry,
# 'c' for a command line" at the bottom -- no extra dialog/whiptail needed
# for that. toml_url= below is a placeholder: press 'e' on either entry and
# replace it with the real answer-file URL before booting. If left
# unedited, curl fails to fetch it and the installer exits cleanly without
# touching any disk -- confirm-wipe still requires an explicit interactive
# confirmation before any disk is wiped either way.
set timeout=30
set default=0

menuentry "projekt-lods: Proxmox VE installer -- local console (tty1)" {
    linux /boot/vmlinuz toml_url=http://CHANGE-ME/answer.toml confirm-wipe console=tty1
    initrd /boot/installer-initrd.img
}

menuentry "projekt-lods: Proxmox VE installer -- serial console (ttyS0, 115200n8)" {
    linux /boot/vmlinuz toml_url=http://CHANGE-ME/answer.toml confirm-wipe console=ttyS0,115200n8
    initrd /boot/installer-initrd.img
}
