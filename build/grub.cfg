# GRUB menu for the lods installer ISO (see build-installer-iso.sh).
# GRUB's own boot menu always shows "press 'e' to edit the selected entry,
# 'c' for a command line" at the bottom -- no extra dialog/whiptail needed
# for that. toml_url= below is a placeholder: press 'e' on whichever entry
# matches your console/reboot preference and replace it with the real
# answer-file URL before booting. If left unedited, curl fails to fetch it
# and the installer exits cleanly without touching any disk -- confirm-wipe
# still requires an explicit interactive confirmation before any disk is
# wiped either way.
#
# Four entries: {local console, serial console} x {auto-reboot, no-reboot}.
# no-reboot is an explicit kernel arg (stays up after a successful install,
# for inspection); auto-reboot is what you get when that arg is simply
# omitted -- there's no separate "auto-reboot" flag, so each such entry's
# title says so plainly rather than leaving it implied. Auto-reboot on the
# local console is the default (first) entry: the entire point of this
# project is unattended automation, not a machine that finishes and sits
# there waiting for someone to notice.
set timeout=30
set default=0

menuentry "lods: Proxmox VE installer -- local console (tty1) -- WILL auto-reboot when done [default]" {
    linux /boot/vmlinuz toml_url=http://CHANGE-ME/answer.toml confirm-wipe console=tty1
    initrd /boot/installer-initrd.img
}

menuentry "lods: Proxmox VE installer -- local console (tty1) -- stay up when done (no-reboot)" {
    linux /boot/vmlinuz toml_url=http://CHANGE-ME/answer.toml confirm-wipe no-reboot console=tty1
    initrd /boot/installer-initrd.img
}

menuentry "lods: Proxmox VE installer -- serial console (ttyS0, 115200n8) -- WILL auto-reboot when done" {
    linux /boot/vmlinuz toml_url=http://CHANGE-ME/answer.toml confirm-wipe console=ttyS0,115200n8
    initrd /boot/installer-initrd.img
}

menuentry "lods: Proxmox VE installer -- serial console (ttyS0, 115200n8) -- stay up when done (no-reboot)" {
    linux /boot/vmlinuz toml_url=http://CHANGE-ME/answer.toml confirm-wipe no-reboot console=ttyS0,115200n8
    initrd /boot/installer-initrd.img
}
