name: Build installer initrd + ISO

# Manual only -- this debootstraps a fresh rootfs and takes several
# minutes, no reason to run it on every push. build-installer-initrd.sh
# itself is not modified by this workflow; SUITE is read from the
# environment (script default: trixie) so this input drives it without
# touching the script's own logic.
on:
  workflow_dispatch:
    inputs:
      debian_suite:
        description: "Debian suite to debootstrap (e.g. trixie, bookworm)"
        required: true
        default: "trixie"
      release_tag:
        description: "Release tag (blank = auto-generate from date + suite + run number)"
        required: false
        default: ""

# contents: write is needed for the publish-release job (gh release create).
permissions:
  contents: write

jobs:
  build-initrd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap cpio xz-utils

      - name: Build installer initrd + kernel
        env:
          SUITE: ${{ inputs.debian_suite }}
        run: sudo -E bash build/build-installer-initrd.sh output

      - name: Upload initrd + kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-initrd-${{ inputs.debian_suite }}
          path: |
            output/installer-initrd.img
            output/vmlinuz
            output/KERNEL_VERSION
          if-no-files-found: error
          retention-days: 14

  build-iso:
    needs: build-initrd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install grub-mkrescue prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - name: Download initrd + kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: installer-initrd-${{ inputs.debian_suite }}
          path: initrd-output

      - name: Build installer ISO
        run: bash build/build-installer-iso.sh initrd-output iso-output

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-iso-${{ inputs.debian_suite }}
          path: iso-output/projekt-lods-installer.iso
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [build-initrd, build-iso]
    runs-on: ubuntu-latest
    steps:
      - name: Download initrd + kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: installer-initrd-${{ inputs.debian_suite }}
          path: initrd-output

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-iso-${{ inputs.debian_suite }}
          path: iso-output

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="lods-$(date -u +%Y%m%d)-${{ inputs.debian_suite }}-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # gh is preinstalled on GitHub-hosted runners. --repo is passed
      # explicitly so this doesn't need a checkout step just to give gh a
      # git remote to infer the repo from.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "projekt-lods (${{ inputs.debian_suite }}, build #${{ github.run_number }})" \
            --notes "Automated build via workflow_dispatch (debian_suite=${{ inputs.debian_suite }})." \
            initrd-output/installer-initrd.img \
            initrd-output/vmlinuz \
            initrd-output/KERNEL_VERSION \
            iso-output/projekt-lods-installer.iso
